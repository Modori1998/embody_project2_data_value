name: P2 Flora Video-only CPU tests

on:
  pull_request:
    branches:
      - feat/p2-flora-g3-adapter-v0-1-20261028
  push:
    branches:
      - feat/p2-flora-video-g3-v0-1-20261028

jobs:
  flora-video-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify ffmpeg and ffprobe
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Synthetic-video tests (no private data, GPU or model)
        run: python -m unittest discover -s tests -p 'test_flora_video_evidence.py' -v
